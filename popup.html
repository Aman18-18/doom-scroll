<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scroll Tracker</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
    
    <script src="theme-toggle.js"></script>
  </head>
  <body>
    <main class="card">
      <header class="hero">
        <div class="hero__orbs" aria-hidden="true">
          <span class="st-orb hero__orb hero__orb--1"></span>
          <span class="st-orb hero__orb hero__orb--2"></span>
        </div>
        <div class="hero__row">
          <span class="hero__badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 3" />
            </svg>
          </span>
          <div class="hero__text">
            <h1 class="hero__title">Scroll Tracker</h1>
            <p class="hero__date" id="today-date">--</p>
          </div>
          <button id="theme-toggle-button" class="st-icon-button hero__theme-toggle" type="button" aria-label="Toggle dark mode">
            <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
            </svg>
          </button>
        </div>
      </header>

      <section class="stats">
        <div class="stat st-reveal" style="--st-i: 0">
          <div class="stat__icon stat__icon--youtube" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>
          </div>
          <div class="stat__info">
            <span class="stat__label">YouTube Shorts</span>
            <span class="stat__value" id="youtube-count">0</span>
          </div>
        </div>

        <div class="stat st-reveal" style="--st-i: 1">
          <div class="stat__icon stat__icon--instagram" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none" />
            </svg>
          </div>
          <div class="stat__info">
            <span class="stat__label">Instagram Reels</span>
            <span class="stat__value" id="instagram-count">0</span>
          </div>
        </div>

        <div class="stat stat--total st-reveal" style="--st-i: 2">
          <div class="stat__icon stat__icon--total" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 17l6-6 4 4 8-8" />
              <path d="M14 7h7v7" />
            </svg>
          </div>
          <div class="stat__info">
            <span class="stat__label">Total</span>
            <span class="stat__value" id="total-count">0</span>
          </div>
        </div>

        <div class="stat stat--time st-reveal" style="--st-i: 3">
          <div class="stat__icon stat__icon--time" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 3" />
            </svg>
          </div>
          <div class="stat__info">
            <span class="stat__label">Time Spent</span>
            <span class="stat__value" id="time-spent">0m</span>
          </div>
        </div>
      </section>

      <footer class="card__footer">
        <button id="open-dashboard-button" class="dashboard-button" type="button">
          <span>View Full Analytics</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <path d="M9 6l6 6-6 6" />
          </svg>
        </button>
        <button id="reset-button" class="reset-button" type="button">
          Reset Today's Counters
        </button>
        <p class="status-message" id="status-message" role="status"></p>
      </footer>
    </main>

    <!-- Load order matters: utils + animations before popup.js -->
    <script src="utils.js"></script>
    <script src="animations.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
